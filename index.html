<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- DNS Prefetch and Preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Optimized font loading with display swap -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Preload critical images for faster LCP -->
    <link rel="preload" as="image" href="/lovable-uploads/hero-mobile.png" media="(max-width: 767px)" fetchpriority="high">
    <link rel="preload" as="image" href="/src/assets/hero-main.png" media="(min-width: 768px)" fetchpriority="high">
    
    <title>Mentoria FULL - Sua Aprovação Começa Aqui | AFA, EN, EFOMM, EEAR</title>
    <meta name="description" content="Mentoria premium para aprovação militar em AFA, EN, EFOMM e EEAR. Acompanhamento 1:1, estratégia comprovada, materiais exclusivos e resultados garantidos." />
    <meta name="author" content="Mentoria FULL" />
    <meta name="keywords" content="mentoria militar, AFA, EN, EFOMM, EEAR, aprovação militar, concurso militar, preparação militar" />

    <meta property="og:title" content="Mentoria FULL - Sua Aprovação Militar Começa Aqui" />
    <meta property="og:description" content="Mentoria premium com estratégia, disciplina e acompanhamento real para sua aprovação em AFA, EN, EFOMM e EEAR." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Performance optimization: Defer non-critical scripts -->
    <script>
      // Preload critical resources
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          // Preload feedback images when browser is idle
          const feedbackImages = [
            '/lovable-uploads/feedback-1.png',
            '/lovable-uploads/feedback-2.png',
            '/lovable-uploads/feedback-3.png',
            '/lovable-uploads/feedback-4.png',
            '/lovable-uploads/feedback-5.png'
          ];
          feedbackImages.forEach(src => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.as = 'image';
            link.href = src;
            document.head.appendChild(link);
          });
        });
      }
    </script>
  </body>
</html>
