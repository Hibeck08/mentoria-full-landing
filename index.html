<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- DNS Prefetch and Preconnect for faster font loading -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Optimized font loading with display swap -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- LCP images are route-specific (bundled WebP) and preloaded by each page -->
    
    <title>Mentoria FULL - Sua Aprovação Começa Aqui | AFA, EN, EFOMM, EEAR</title>
    <meta name="description" content="Mentoria premium para aprovação militar em AFA, EN, EFOMM e EEAR. Acompanhamento 1:1, estratégia comprovada, materiais exclusivos e resultados garantidos." />
    <meta name="author" content="Mentoria FULL" />
    <meta name="keywords" content="mentoria militar, AFA, EN, EFOMM, EEAR, aprovação militar, concurso militar, preparação militar" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fullconcursosmilitares.com/" />
    <meta property="og:title" content="Mentoria FULL - Sua Aprovação Militar Começa Aqui" />
    <meta property="og:description" content="Mentoria premium com estratégia, disciplina e acompanhamento real para sua aprovação em AFA, EN, EFOMM e EEAR." />
    <meta property="og:image" content="https://fullconcursosmilitares.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://fullconcursosmilitares.com/" />
    <meta name="twitter:title" content="Mentoria FULL - Sua Aprovação Militar Começa Aqui" />
    <meta name="twitter:description" content="Mentoria premium com estratégia, disciplina e acompanhamento real para sua aprovação em AFA, EN, EFOMM e EEAR." />
    <meta name="twitter:image" content="https://fullconcursosmilitares.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Prefetch de depoimentos quando o navegador estiver ocioso -->
    <script>
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => {
          ['/lovable-uploads/feedback-1.jpg', '/lovable-uploads/feedback-2.jpg', '/lovable-uploads/feedback-3.jpg'].forEach(src => {
            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.as = 'image';
            link.href = src;
            document.head.appendChild(link);
          });
        });
      }
    </script>
  </body>
</html>
